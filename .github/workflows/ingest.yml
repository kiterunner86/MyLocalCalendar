name: Ingest events

on:
  schedule:
    # Once a day to start (adaptive scheduling comes later once we're
    # observing real source behavior). Runs at 03:00 UTC / 07:00 Asia/Dubai.
    - cron: "0 3 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  run-ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Run schema.org ingestion
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ingestion/schema_org_ingest.py
